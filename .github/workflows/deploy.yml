name: CI/CD - Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run a deploy manually from the Actions tab

concurrency:
  group: deploy-ec2
  cancel-in-progress: false # never run two deploys at once

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

      - name: Build Docker image
        run: docker build -t products-backend .

  deploy:
    needs: build            # only deploy if the build job passed
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/backend
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            sleep 10
            curl -fsS http://localhost:5000/products > /dev/null && echo "Deploy OK"